            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            transition: all 500ms ease-out;

        }

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Shell Suppressed for Welcome Screen per UX rules -->
<main class="relative min-h-screen flex flex-col items-center justify-between px-8 py-16 lg:py-24">
<!-- Hero Illustration Area -->
<div class="relative w-full max-w-2xl aspect-[4/5] md:aspect-video rounded-[48px] overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-tertiary-fixed-dim opacity-40 mix-blend-multiply"></div>
<img class="w-full h-full object-cover" data-alt="abstract macro photography of crystalline water ripples with soft morning light and ethereal blue and white gradient tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWHV_8dyBnG4RXvaeO4bS1mYJ2tVKvVpPMdcI-xNGZTUaW-PIqQslKjlotIUJ-PSFiwbQVaKu1xlhQwqDwbzlY8KIq-Y3A7NNWw_9MET51U5jeL1CQZPbk9t14lYXAx4u20k10VNUHu7kY1_DDi6LW0ZvhWvwmB5bvR_T14zkbG9Pyum-MZsw1oqC-tCM2ur6xYOUBznGNzKHVqEPhtIlIcvz9fXVVk5zAV4ztFex-ddAzKuMBwhQql7xtueQVjzQ6Sqad2mZGTvF0"/>
<!-- Glassmorphism Decorative Elements -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-white/20 backdrop-blur-3xl rounded-full border border-white/10"></div>
</div>
<!-- Identity Cluster -->
<div class="flex flex-col items-center text-center space-y-6 mt-12 mb-auto max-w-md">
<h1 class="font-headline text-5xl md:text-6xl font-light tracking-widest text-on-surface">
                Raylynnia
            </h1>
<p class="font-headline text-xl font-light tracking-[0.2em] text-on-surface-variant uppercase">
                Find your flow.
            </p>
<!-- Subtle Tonal Layer Divider (No lines per rule) -->
<div class="w-12 h-1.5 bg-primary-container rounded-full mt-4"></div>
</div>
<!-- Action Area -->
<div class="w-full max-w-sm px-4">
<button class="bloom-effect group relative w-full overflow-hidden bg-gradient-to-r from-primary to-primary-dim text-on-primary font-body font-medium tracking-wide py-5 px-8 rounded-full shadow-[0_12px_32px_0_rgba(44,52,55,0.04)] hover:shadow-lg transition-all duration-500">
<span class="relative z-10 flex items-center justify-center space-x-2">
<span>Get Started</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</span>
<!-- Background bloom hover effect -->
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
</button>
<!-- Secondary Contextual Link -->
<button class="mt-6 w-full text-on-surface-variant font-label text-sm tracking-widest uppercase py-4 transition-opacity duration-500 hover:opacity-60">
                Existing Member Login
            </button>
</div>
<!-- Atmospheric Background Blooms -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px] -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-tertiary-container/10 rounded-full blur-[140px] -z-10"></div>
</main>
<!-- BottomNavBar Suppressed for Welcome/Onboarding Screen per UX rules -->
